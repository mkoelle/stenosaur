---
services:
  firefoxZoom:
    image: firefox-zoom
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: firefox
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - PIXELFLUX_WAYLAND=true
      - TZ=America/Chicago
      - FIREFOX_CLI=https://www.duckduckgo.com #optional
    volumes:
      - ./tmp:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
