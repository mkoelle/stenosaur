version: '3'

vars:
  BINARY: stenosaur
  CMD: ./cmd/stenosaur

tasks:
  generate:
    desc: run templ codegen and Tailwind CSS build
    cmds:
      - templ generate ./...
      - tailwindcss -i ./pkg/controller/ui/static/tw.src.css -o ./pkg/controller/ui/static/tw.css --content './pkg/controller/ui/**/*.templ' --minify

  build:
    desc: compile the binary
    deps: [generate]
    cmds:
      - go build -o bin/{{.BINARY}} {{.CMD}}

  test:
    desc: run all tests
    cmds:
      - go test ./...

  test-race:
    desc: run all tests with race detector
    cmds:
      - go test -race ./...

  vet:
    desc: run go vet
    cmds:
      - go vet ./...

  lint:
    desc: run all linting and validation tasks
    deps: [fmt, tidy, vet, verify, vulncheck]

  check:
    desc: alias for lint
    cmds:
      - task: lint

  ci:
    desc: run all checks and tests (for CI/CD)
    deps: [check, test]

  pre-commit:
    desc: run all checks, tests, and build before committing
    deps: [check, test, build]

  develop:
    desc: run generation and build for local development
    deps: [generate, build]

  tidy:
    desc: run go mod tidy
    cmds:
      - go mod tidy

  fmt:
    desc: run go fmt
    cmds:
      - go fmt ./...

  verify:
    desc: run go mod verify
    cmds:
      - go mod verify

  vulncheck:
    desc: run vulnerability check
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  coverage:
    desc: run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  docs:
    desc: run local documentation server
    cmds:
      - echo "Documentation server starting at http://localhost:8080"
      - go run golang.org/x/pkgsite/cmd/pkgsite@latest

  update:
    desc: update dependencies to latest minor/patch versions
    cmds:
      - go get -u ./...
      - go mod tidy

  up:
    desc: build image and start with Docker Compose
    cmds:
      - docker compose up --build

  down:
    desc: stop Docker Compose services
    cmds:
      - docker compose down

  image:
    desc: build the Docker image only
    cmds:
      - docker compose build

  clean:
    desc: remove build artifacts
    cmds:
      - rm -rf bin/
